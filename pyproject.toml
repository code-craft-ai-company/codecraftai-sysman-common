[tool.poetry]
name = "codecraftai-sysman-common"
description = "Code Craft AI - System Management Common Foundation"
version = "1.0.0"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-errors = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interfaces = { version = "<2.0.0", source = "codecraftai" }

[tool.poetry.group.dev.dependencies]
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
