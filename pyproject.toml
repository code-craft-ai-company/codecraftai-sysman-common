[tool.poetry]
name = "codecraftai-sysman-common"
description = "Code Craft AI - System Management Common Foundation"
version = "0.0.1"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-errors = { git = "https://github.com/automationmojo/codecraftai-errors.git", branch = "main" }
codecraftai-interfaces = { git = "https://github.com/automationmojo/codecraftai-interfaces.git", branch = "main" }

[tool.poetry.group.dev.dependencies]
hypothesis = ">=6.0.0"
codecraftai-testbase = { git = "https://github.com/automationmojo/codecraftai-testbase.git", branch = "main" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
